<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>نبض بازار</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;500;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a1d26;--ink:#e9f3f1;--mut:#8fa9ad;--line:#1d3a46;--up:#4fd8b8;--dn:#ff7d6e;--gold:#f1bd55;--warn:#f1bd55}
@media(prefers-color-scheme:light){:root{--bg:#eef4f2;--ink:#0d2630;--mut:#587176;--line:#cddcd8;--up:#0b8f72;--dn:#c8432f;--gold:#9a6a12;--warn:#9a6a12}}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;color:var(--ink);font-family:Vazirmatn,Tahoma,system-ui,sans-serif;font-feature-settings:"tnum";line-height:1.7}
.wrap{max-width:980px;margin:0 auto;padding:28px 20px 48px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{margin:0;font-size:1.35rem;font-weight:800}
.status{display:flex;align-items:center;gap:10px;color:var(--mut);font-size:.85rem}
.dot{width:9px;height:9px;border-radius:50%;background:var(--up)}
.dot.stale{background:var(--warn)}
button{font:inherit;color:var(--ink);background:none;border:1px solid var(--line);border-radius:999px;padding:3px 14px;cursor:pointer;transition:border-color .2s}
button:hover{border-color:var(--mut)}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
button svg{vertical-align:-3px;margin-inline-end:4px}
button.spin svg{animation:rot .8s ease}
@keyframes rot{to{transform:rotate(360deg)}}
.note{margin:14px 0 0;padding:10px 14px;border-inline-start:3px solid var(--warn);color:var(--warn);font-size:.9rem}
.note[hidden]{display:none}

.hero{padding:44px 0 10px}
.hero .name{color:var(--mut);font-size:1rem}
.big{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.big b{font-size:clamp(3.4rem,15vw,7.5rem);font-weight:800;line-height:1.15;letter-spacing:-.01em}
.big small{color:var(--mut);font-size:1.1rem}
.chg{font-size:.95rem;font-weight:500}
.up{color:var(--up)}.dn{color:var(--dn)}

.chart{position:relative;height:190px;margin-top:18px;touch-action:pan-y;direction:ltr;cursor:crosshair}
.chart[hidden]{display:none}
.chart svg{width:100%;height:100%;display:block;overflow:visible}
.line{fill:none;stroke:var(--gold);stroke-width:2.5;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1}
.area{fill:url(#g);opacity:0}
.chart.in .line{stroke-dashoffset:0;transition:stroke-dashoffset 1.8s cubic-bezier(.3,.7,.2,1)}
.chart.in .area{opacity:1;transition:opacity 1.2s ease .9s}
.pt{position:absolute;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 5px color-mix(in srgb,var(--gold) 25%,transparent);opacity:0;pointer-events:none;transition:opacity .15s}
.tip{position:absolute;top:-6px;transform:translate(-50%,-100%);background:var(--ink);color:var(--bg);padding:2px 10px;border-radius:8px;font-size:.8rem;white-space:nowrap;opacity:0;pointer-events:none;direction:rtl;text-align:center;transition:opacity .15s}
.chart.hv .pt,.chart.hv .tip{opacity:1}
.range{display:flex;justify-content:space-between;direction:ltr;color:var(--mut);font-size:.78rem;margin-top:6px}

.groups{display:grid;grid-template-columns:1fr;gap:6px 56px;margin-top:34px}
@media(min-width:760px){.groups{grid-template-columns:1fr 1fr}}
.grp{margin-bottom:22px}
.grp h2{margin:0 0 4px;font-size:.95rem;font-weight:800;color:var(--gold);padding-bottom:6px;border-bottom:1px solid var(--gold)}
.row{display:flex;align-items:baseline;gap:10px;padding:13px 4px;border-bottom:1px solid var(--line)}
.row .lbl{flex:1;color:var(--mut);font-size:.95rem}
.row .val b{font-size:1.15rem;font-weight:500}
.row .val small{color:var(--mut);margin-inline-start:6px;font-size:.78rem}
.row .dl{min-width:68px;text-align:end;font-size:.78rem}
.row.fu{animation:fu 1.6s ease-out}
.row.fd{animation:fd 1.6s ease-out}
@keyframes fu{from{background:color-mix(in srgb,var(--up) 22%,transparent)}}
@keyframes fd{from{background:color-mix(in srgb,var(--dn) 22%,transparent)}}

.sk{border-radius:10px;background:linear-gradient(90deg,var(--line),color-mix(in srgb,var(--line) 40%,transparent),var(--line));background-size:200% 100%;animation:sh 1.3s linear infinite}
@keyframes sh{to{background-position:-200% 0}}
.err{margin-top:24px;padding:14px;border:1px solid var(--dn);border-radius:10px;color:var(--dn)}
.err[hidden]{display:none}
footer{margin-top:20px;color:var(--mut);font-size:.78rem}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.line{stroke-dashoffset:0!important}.area{opacity:1!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>نبض بازار</h1>
    <div class="status">
      <span class="dot" id="dot"></span><span id="upd">در حال دریافت…</span>
      <button id="rf" type="button"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/></svg>بروزرسانی</button>
    </div>
  </header>
  <p class="note" id="stale" hidden></p>
  <div class="err" id="err" hidden>دریافت اطلاعات ناموفق بود. اتصال اینترنت را بررسی کنید و دوباره تلاش کنید.</div>

  <section class="hero">
    <div class="name">دلار آمریکا</div>
    <div class="big"><b id="hv" class="sk" style="min-width:8ch;height:1.1em;display:inline-block">&nbsp;</b><small>تومان</small><span class="chg" id="hc"></span></div>
    <div class="chart" id="chart" hidden>
      <svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
        <defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--gold)" stop-opacity=".28"/><stop offset="1" stop-color="var(--gold)" stop-opacity="0"/></linearGradient></defs>
        <path class="area" id="area"/><path class="line" id="ln" pathLength="1"/>
      </svg>
      <div class="pt" id="pt"></div><div class="tip" id="tip"></div>
    </div>
    <div class="range" id="range" hidden><span id="r1"></span><span id="r2"></span></div>
  </section>

  <div class="groups" id="groups"><div class="sk" style="height:240px"></div><div class="sk" style="height:240px"></div></div>
  <footer>قیمت‌ها صرفاً جهت اطلاع است و هر ۶۰ ثانیه به‌روز می‌شوند.</footer>
</div>

<script>
// منبع داده: اگر اولی در دسترس نبود به بعدی می‌رود
const BASES=[
  'https://raw.githubusercontent.com/mahdiesmaily/usd/main/',
  'https://raw.githubusercontent.com/itsyebekhe/usd/main/'
];
const REFRESH_MS=60000;

// کلیدها: [عنوان, واحد]. کلید ناشناخته‌ای که عدد باشد خودکار در «سایر» نمایش داده می‌شود.
const DEF={
  usd:['دلار آمریکا','تومان'],eur:['یورو اروپا','تومان'],
  gold_18k:['طلای ۱۸ عیار (هر گرم)','تومان'],gold_mesghal:['مثقال طلا (آبشده)','تومان'],gold_ounce:['انس جهانی طلا','دلار'],
  coin_emami:['سکه تمام امامی','تومان'],coin_bahar:['سکه بهار آزادی','تومان'],coin_nim:['نیم سکه','تومان'],coin_rob:['ربع سکه','تومان'],coin_gerami:['سکه گرمی','تومان'],
  oil:['نفت خام برنت','دلار']
};
const GROUPS=[['ارز',['eur']],['طلا',['gold_18k','gold_mesghal','gold_ounce']],['سکه',['coin_emami','coin_bahar','coin_nim','coin_rob','coin_gerami']],['انرژی',['oil']]];
const SKIP=['updated_at','date_shamsi','usd'];

const $=id=>document.getElementById(id);
const RM=matchMedia('(prefers-reduced-motion:reduce)').matches;
const toFa=s=>String(s).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]);
const nf0=new Intl.NumberFormat('fa-IR',{maximumFractionDigits:0});
const nf2=new Intl.NumberFormat('fa-IR',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmt=(v,dec)=>(dec?nf2:nf0).format(v);

const cur={},rows={};let built=false,first=true,lastLoad=0;
let stored={};try{stored=JSON.parse(localStorage.getItem('mkt')||'{}')}catch(e){}

function tween(el,from,to){
  const dec=!Number.isInteger(to);
  if(RM||from===to){el.textContent=fmt(to,dec);return}
  const t0=performance.now(),d=1000;
  (function step(t){
    const p=Math.min(1,(t-t0)/d),e=1-Math.pow(1-p,4);
    el.textContent=fmt(from+(to-from)*e,dec);
    if(p<1)requestAnimationFrame(step);
  })(t0);
}
function delta(el,base,now){
  if(base==null||base===now||!base){return null}
  const p=(now-base)/base*100,up=p>0;
  el.className=(el.className.split(' ')[0])+' '+(up?'up':'dn');
  el.textContent=(up?'▲ ':'▼ ')+toFa(Math.abs(p).toFixed(2))+'٪';
  el.title='تغییر نسبت به بروزرسانی قبلی';
  return up;
}

async function getJSON(file){
  for(const b of BASES){
    try{const r=await fetch(b+file+'?t='+Date.now(),{cache:'no-store'});if(r.ok)return await r.json()}catch(e){}
  }
  throw new Error('fetch failed');
}

function build(d){
  const g=$('groups');g.innerHTML='';
  const used=new Set(SKIP);
  const groups=GROUPS.map(([t,ks])=>[t,ks.filter(k=>Number.isFinite(parseFloat(d[k])))]);
  groups.forEach(([,ks])=>ks.forEach(k=>used.add(k)));
  const extra=Object.keys(d).filter(k=>!used.has(k)&&Number.isFinite(parseFloat(d[k])));
  if(extra.length)groups.push(['سایر',extra]);
  for(const [t,ks] of groups){
    if(!ks.length)continue;
    const s=document.createElement('section');s.className='grp';
    s.innerHTML='<h2>'+t+'</h2>';
    for(const k of ks){
      const [lbl,unit]=DEF[k]||[k,''];
      const r=document.createElement('div');r.className='row';
      r.innerHTML='<span class="lbl">'+lbl+'</span><span class="val"><b>۰</b><small>'+unit+'</small></span><span class="dl"></span>';
      s.appendChild(r);rows[k]=r;
    }
    g.appendChild(s);
  }
  built=true;
}

function render(d){
  if(!built)build(d);
  const hv=$('hv');hv.classList.remove('sk');hv.removeAttribute('style');
  const all=['usd',...Object.keys(rows)];
  for(const k of all){
    const v=parseFloat(d[k]);if(!Number.isFinite(v))continue;
    const el=k==='usd'?hv:rows[k].querySelector('b');
    tween(el,cur[k]??0,v);
    const base=cur[k]??stored[k];
    const dl=k==='usd'?$('hc'):rows[k].querySelector('.dl');
    const up=delta(dl,base,v);
    if(up!=null&&k!=='usd'&&!first){rows[k].classList.remove('fu','fd');void rows[k].offsetWidth;rows[k].classList.add(up?'fu':'fd')}
    cur[k]=v;stored[k]=v;
  }
  try{localStorage.setItem('mkt',JSON.stringify(stored))}catch(e){}
  first=false;

  // وضعیت و تازگی داده
  const ts=d.updated_at?new Date(String(d.updated_at).replace(' ','T')+'+03:30'):null;
  const time=d.updated_at?String(d.updated_at).slice(11,16):'';
  $('upd').textContent='آخرین بروزرسانی: '+toFa((d.date_shamsi||'')+(time?' – '+time:''));
  const stale=$('stale'),dot=$('dot');
  const hrs=ts&&!isNaN(ts)?(Date.now()-ts)/36e5:0;
  if(hrs>3){
    const txt=hrs>48?toFa(Math.floor(hrs/24))+' روز':toFa(Math.floor(hrs))+' ساعت';
    stale.textContent='این داده حدود '+txt+' پیش به‌روز شده است؛ منبع داده ممکن است متوقف شده باشد.';
    stale.hidden=false;dot.classList.add('stale');
  }else{stale.hidden=true;dot.classList.remove('stale')}
}

// ---- نمودار ----
function normHist(j){
  if(j&&!Array.isArray(j)&&typeof j==='object'){const a=j.history||j.data||j.items;if(Array.isArray(a))j=a}
  const arr=Array.isArray(j)?j:(j&&typeof j==='object'?Object.entries(j).map(([k,v])=>v&&typeof v==='object'?{date:k,...v}:{date:k,v}):[]);
  return arr.map(x=>{
    let v,d;
    if(typeof x==='number')v=x;
    else if(x&&typeof x==='object'){
      for(const k of ['usd','price','close','value','rate','v','p','c'])if(x[k]!=null&&Number.isFinite(+x[k])){v=+x[k];break}
      if(v===undefined){const f=Object.entries(x).find(([k,val])=>val!=null&&!/date|time|day/i.test(k)&&Number.isFinite(+val));if(f)v=+f[1]}
      d=x.date_shamsi||x.date||x.d||x.time||x.t||x.updated_at;
    }
    return Number.isFinite(v)?{v,d}:null;
  }).filter(Boolean).slice(-180);
}
function drawChart(h){
  if(h.length<2)return;
  const vs=h.map(p=>p.v),mn=Math.min(...vs),mx=Math.max(...vs),n=h.length;
  const X=i=>i/(n-1)*100,Y=v=>92-(v-mn)/((mx-mn)||1)*84;
  const pts=h.map((p,i)=>X(i).toFixed(2)+' '+Y(p.v).toFixed(2));
  const line='M'+pts.join(' L');
  $('ln').setAttribute('d',line);
  $('area').setAttribute('d',line+' L100 100 L0 100 Z');
  const c=$('chart');c.hidden=false;
  const lab=(p,i)=>p.d?toFa(p.d):(i===n-1?'امروز':toFa(n-1-i)+' روز پیش');
  $('r1').textContent=lab(h[0],0);$('r2').textContent=lab(h[n-1],n-1);$('range').hidden=false;
  requestAnimationFrame(()=>requestAnimationFrame(()=>c.classList.add('in')));
  const pt=$('pt'),tip=$('tip');
  c.addEventListener('pointermove',e=>{
    const r=c.getBoundingClientRect();
    const i=Math.max(0,Math.min(n-1,Math.round((e.clientX-r.left)/r.width*(n-1))));
    const x=X(i);
    pt.style.left=x+'%';pt.style.top=Y(h[i].v)+'%';
    tip.style.left=Math.max(14,Math.min(86,x))+'%';
    tip.innerHTML='<span style="opacity:.7;font-size:.72rem">'+lab(h[i],i)+'</span><br><b>'+fmt(h[i].v,false)+'</b>';
    c.classList.add('hv');
  });
  c.addEventListener('pointerleave',()=>c.classList.remove('hv'));
}

async function load(){
  lastLoad=Date.now();
  try{
    const d=await getJSON('market.json');
    $('err').hidden=true;render(d);
  }catch(e){
    $('err').hidden=false;
    if(!built)$('groups').innerHTML='';
  }
}
(async()=>{
  load();
  try{drawChart(normHist(await getJSON('api/history.json')))}catch(e){}
})();

$('rf').addEventListener('click',e=>{
  const b=e.currentTarget;b.classList.remove('spin');void b.offsetWidth;b.classList.add('spin');load();
});
setInterval(()=>{if(!document.hidden)load()},REFRESH_MS);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&Date.now()-lastLoad>30000)load()});
</script>
</body>
</html>
